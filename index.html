  <!-- AOS + Menu + Terapkan pengaturan KLINIK -->
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script>
    // Animasi scroll (jika AOS gagal dimuat, konten tetap tampil & bisa diklik)
    if (window.AOS) {
      AOS.init({ duration: 800, easing: 'ease-out-cubic', once: true, offset: 60 });
    } else {
      document.querySelectorAll('[data-aos]').forEach(e => e.removeAttribute('data-aos'));
    }

    // Menu mobile
    const btn = document.getElementById('menuBtn');
    const menu = document.getElementById('mobileMenu');
    const iconOpen = document.getElementById('iconOpen');
    const iconClose = document.getElementById('iconClose');

    function toggleMenu(forceClose = false) {
      const isOpen = !menu.classList.contains('hidden');
      const shouldOpen = forceClose ? false : !isOpen;
      menu.classList.toggle('hidden', !shouldOpen);
      iconOpen.classList.toggle('hidden', shouldOpen);
      iconClose.classList.toggle('hidden', !shouldOpen);
      btn.setAttribute('aria-expanded', shouldOpen);
    }
    btn.addEventListener('click', () => toggleMenu());
    menu.querySelectorAll('a').forEach(a => a.addEventListener('click', () => toggleMenu(true)));

    // ---- Terapkan pengaturan dari blok KLINIK di atas ----
    (function () {
      const K = window.KLINIK;
      const intl = s => { let d = String(s).replace(/\D/g, ''); if (d.startsWith('0')) d = '62' + d.slice(1); return d; };
      const jam = n => String(n).padStart(2, '0') + '.00';

      // Nama klinik: kata pertama biasa, sisanya berwarna (navbar & footer), plus judul tab
      const [depan, ...sisa] = K.NAMA_KLINIK.trim().split(/\s+/);
      document.querySelectorAll('[data-nama]').forEach(e => {
        e.textContent = depan;
        if (sisa.length) {
          const s = document.createElement('span');
          s.className = e.dataset.warna;
          s.textContent = ' ' + sisa.join(' ');
          e.append(s);
        }
      });
      document.querySelectorAll('[data-isi="nama"]').forEach(e => e.textContent = K.NAMA_KLINIK);
      document.title = K.NAMA_KLINIK + ' - Perawatan Modern, Hati yang Tenang';

      // Foto hero
      const foto = document.getElementById('fotoHero');
      foto.src = K.FOTO_HERO;
      foto.alt = K.NAMA_KLINIK;

      // WhatsApp
      const waUtama = intl(K.WA_NOMOR);
      const waJanji = intl(K.WA_JANJI || K.WA_NOMOR);
      window.KLINIK_WA_JANJI = waJanji;

      const wa = {
        janji:   [waJanji, K.PESAN_JANJI],
        bantuan: [waUtama, K.PESAN_BANTUAN],
        tanya:   [waUtama, K.PESAN_TANYA]
      };
      document.querySelectorAll('[data-wa]').forEach(a => {
        const [nomor, pesan] = wa[a.dataset.wa];
        a.href = 'https://wa.me/' + nomor + '?text=' + encodeURIComponent(pesan);
      });

      // Telepon, alamat, jam
      document.querySelectorAll('[data-tel]').forEach(a => {
        const v = K[a.dataset.tel];
        a.href = 'tel:+' + intl(v);
        a.textContent = v;
      });
      document.querySelectorAll('[data-isi="alamat"]').forEach(e => e.textContent = K.ALAMAT);
      document.querySelectorAll('[data-isi="jam"]').forEach(e => e.textContent = 'Buka setiap hari, ' + jam(K.JAM_BUKA) + ' – ' + jam(K.JAM_TUTUP));

      // Google Maps
      const peta = document.getElementById('peta');
      peta.title = 'Lokasi ' + K.NAMA_KLINIK;
      peta.src = K.MAPS_EMBED ||
        'https://www.google.com/maps?q=' + encodeURIComponent(K.MAPS_CARI) + '&z=15&output=embed';
    })();
  </script>

  <!-- ================= STATUS + FORM JANJI + FIREBASE (script terpisah) ================= -->
  <script>
    (function () {
      const K = window.KLINIK;
      const intl = s => { let d = String(s).replace(/\D/g, ''); if (d.startsWith('0')) d = '62' + d.slice(1); return d; };
      const WA = window.KLINIK_WA_JANJI || intl(K.WA_JANJI || K.WA_NOMOR);
      const BUKA = K.JAM_BUKA, TUTUP = K.JAM_TUTUP;

      /* ---------- DATA JADWAL DOKTER (ubah di sini bila jadwal berubah) ----------
         Kunci hari: 0 = Minggu, 1 = Senin, ... 6 = Sabtu. Nilai: [jam mulai, jam selesai] */
      const DOKTER = {
        andi: { nama: "dr. Andi Rahman",      jam: { 1:[8,14], 2:[8,14], 3:[8,14], 4:[14,20], 5:[14,20], 6:[8,12] } },
        siti: { nama: "drg. Siti Wulandari",  jam: { 1:[10,16], 3:[10,16], 5:[10,16], 2:[15,20], 4:[15,20] } }
      };

      /* ---------- FIREBASE (dimuat terpisah; kalau gagal, form tetap jalan) ---------- */
      const firebaseConfig = {
        apiKey: "AIzaSyDp4sRoFKh_6EnuINbaPxCeq75izHw6FaE",
        authDomain: "klinik-bidan-lulu-1b7d6.firebaseapp.com",
        projectId: "klinik-bidan-lulu-1b7d6",
        storageBucket: "klinik-bidan-lulu-1b7d6.firebasestorage.app",
        messagingSenderId: "830365339294",
        appId: "1:830365339294:web:4017707ca15aa532fe758f",
        measurementId: "G-LW93LEMVKM"
      };

      let fbPromise = null;
      function getFirebase() {
        if (!fbPromise) {
          fbPromise = (async () => {
            const base = "https://www.gstatic.com/firebasejs/11.0.2/";
            const { initializeApp } = await import(base + "firebase-app.js");
            const { getFirestore, collection, addDoc, serverTimestamp } = await import(base + "firebase-firestore.js");
            const app = initializeApp(firebaseConfig);
            import(base + "firebase-analytics.js")
              .then(m => m.getAnalytics(app))
              .catch(err => console.warn("Firebase Analytics tidak aktif:", err));
            return { db: getFirestore(app), collection, addDoc, serverTimestamp };
          })();
          fbPromise.catch(() => { fbPromise = null; }); // boleh dicoba lagi nanti
        }
        return fbPromise;
      }
      getFirebase().catch(err => console.warn("Firebase belum bisa dimuat:", err));

      const tunggu = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);

      /* ---------- WAKTU (zona WIB) ---------- */
      const HARI = { Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6 };
      function sekarang() {
        const p = new Intl.DateTimeFormat("en-US", {
          timeZone: "Asia/Jakarta", weekday: "short", year: "numeric", month: "2-digit",
          day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23"
        }).formatToParts(new Date());
        const g = t => p.find(x => x.type === t).value;
        return { hari: HARI[g("weekday")], jam: +g("hour") + (+g("minute")) / 60, tgl: `${g("year")}-${g("month")}-${g("day")}` };
      }
      const fmt = h => { const j = Math.floor(h), m = Math.round((h - j) * 60); return String(j).padStart(2, "0") + "." + String(m).padStart(2, "0"); };

      /* ---------- BADGE BUKA/TUTUP & STATUS DOKTER ---------- */
      const dot = document.getElementById("statusDot");
      const statusText = document.getElementById("statusText");

      function updateStatus() {
        const n = sekarang();
        const buka = n.jam >= BUKA && n.jam < TUTUP;
        dot.className = "w-2 h-2 rounded-full " + (buka ? "bg-green-500 animate-pulse" : "bg-slate-400");
        statusText.textContent = buka
          ? `Buka sekarang · tutup ${fmt(TUTUP)}`
          : `Sedang tutup · buka ${n.jam < BUKA ? "hari ini" : "besok"} ${fmt(BUKA)}`;

        document.querySelectorAll("[data-status]").forEach(badge => {
          const r = DOKTER[badge.dataset.status].jam[n.hari];
          let cls, txt;
          if (!r)                                   { cls = "bg-slate-100 text-slate-500"; txt = "Tidak praktik hari ini"; }
          else if (n.jam >= r[0] && n.jam < r[1])   { cls = "bg-green-100 text-green-700"; txt = `Sedang praktik hingga ${fmt(r[1])}`; }
          else if (n.jam < r[0])                    { cls = "bg-amber-100 text-amber-700"; txt = `Praktik hari ini ${fmt(r[0])} – ${fmt(r[1])}`; }
          else                                      { cls = "bg-slate-100 text-slate-500"; txt = "Praktik hari ini sudah selesai"; }
          badge.className = "inline-block text-xs font-semibold px-2.5 py-1 rounded-full " + cls;
          badge.textContent = txt;
        });
      }
      updateStatus();
      setInterval(updateStatus, 60000);

      /* ---------- FORM JANJI TEMU ---------- */
      const f = document.getElementById("formJanji");
      const el = f.elements;
      const hint = document.getElementById("slotHint");
      const errBox = document.getElementById("formError");
      const btnKirim = document.getElementById("btnKirim");
      const sukses = document.getElementById("formSukses");

      // Kolom jebakan anti-spam: diganti namanya & dikosongkan supaya tidak terisi otomatis oleh browser
      const jebakan = f.querySelector('input[aria-hidden="true"]');
      if (jebakan) { jebakan.name = "kolom_jebakan"; jebakan.value = ""; }

      // Batas tanggal: hari ini sampai 60 hari ke depan
      (function () {
        const [y, m, d] = sekarang().tgl.split("-").map(Number);
        const iso = dt => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
        el.tanggal.min = iso(new Date(y, m - 1, d));
        el.tanggal.max = iso(new Date(y, m - 1, d + 60));
      })();

      function slotList(key, tgl) {
        const [y, m, d] = tgl.split("-").map(Number);
        const hari = new Date(y, m - 1, d).getDay();
        const keys = key === "any" ? Object.keys(DOKTER) : [key];
        const set = new Set();
        keys.forEach(k => {
          const r = DOKTER[k].jam[hari];
          if (r) for (let t = r[0]; t < r[1]; t += 0.5) set.add(t);
        });
        let arr = [...set].sort((a, b) => a - b);
        const n = sekarang();
        if (tgl === n.tgl) arr = arr.filter(t => t >= n.jam + 0.5);
        return arr;
      }

      function rentangTeks(key, tgl) {
        const [y, m, d] = tgl.split("-").map(Number);
        const hari = new Date(y, m - 1, d).getDay();
        const keys = key === "any" ? Object.keys(DOKTER) : [key];
        return keys.map(k => { const r = DOKTER[k].jam[hari]; return r ? `${DOKTER[k].nama}: ${fmt(r[0])} – ${fmt(r[1])}` : null; })
                   .filter(Boolean).join(" · ");
      }

      function refreshSlots() {
        const tgl = el.tanggal.value, dok = el.dokter.value;
        if (!tgl) {
          el.jam.innerHTML = '<option value="">Pilih tanggal dulu</option>';
          hint.textContent = ""; hint.className = "sm:col-span-2 -mt-1 text-xs text-slate-500";
          return;
        }
        const slots = slotList(dok, tgl);
        if (!slots.length) {
          el.jam.innerHTML = '<option value="">Tidak ada jam tersedia</option>';
          hint.textContent = "Tidak ada jam praktik yang tersedia pada tanggal ini. Silakan pilih tanggal atau dokter lain.";
          hint.className = "sm:col-span-2 -mt-1 text-xs font-medium text-amber-600";
          return;
        }
        el.jam.innerHTML = '<option value="">Pilih jam</option>' + slots.map(t => `<option value="${fmt(t)}">${fmt(t)}</option>`).join("");
        hint.textContent = "Jam praktik — " + rentangTeks(dok, tgl);
        hint.className = "sm:col-span-2 -mt-1 text-xs text-slate-500";
      }

      // Pilih layanan -> saran dokter otomatis
      el.layanan.addEventListener("change", () => {
        const v = el.layanan.value;
        if (v === "Poli Gigi") el.dokter.value = "siti";
        else if (v === "Poli Umum") el.dokter.value = "andi";
        else if (v) el.dokter.value = "any";
        refreshSlots();
      });
      el.dokter.addEventListener("change", refreshSlots);
      el.tanggal.addEventListener("change", refreshSlots);

      const tampilError = msg => { errBox.textContent = msg; };

      f.addEventListener("submit", async e => {
        e.preventDefault();
        tampilError("");
        if (jebakan && jebakan.value) return; // terisi bot

        const nama = el.nama.value.trim();
        const hp = el.hp.value.replace(/[\s-]/g, "");
        const layanan = el.layanan.value;
        const dokKey = el.dokter.value;
        const tgl = el.tanggal.value;
        const jam = el.jam.value;
        const keluhan = el.keluhan.value.trim();

        if (nama.length < 3) return tampilError("Mohon isi nama lengkap Anda.");
        if (!/^(\+62|62|0)8\d{8,12}$/.test(hp)) return tampilError("Nomor WhatsApp belum valid. Contoh: 081234567890.");
        if (!layanan) return tampilError("Silakan pilih layanan.");
        if (!tgl) return tampilError("Silakan pilih tanggal kunjungan.");
        if (!jam) return tampilError("Silakan pilih jam kunjungan.");

        const dokLabel = dokKey === "any" ? "Dokter yang tersedia" : DOKTER[dokKey].nama;
        const [y, m, d] = tgl.split("-").map(Number);
        const tglLabel = new Date(y, m - 1, d).toLocaleDateString("id-ID", { weekday: "long", day: "numeric", month: "long", year: "numeric" });

        btnKirim.disabled = true;
        btnKirim.textContent = "Mengirim…";

        try {
          // 1) Simpan ke Firebase. Kalau gagal, alur WhatsApp tetap jalan.
          let tersimpan = false;
          try {
            await tunggu((async () => {
              const fb = await getFirebase();
              await fb.addDoc(fb.collection(fb.db, "janji_temu"), {
                nama, hp, layanan, dokter: dokLabel, tanggal: tgl, jam, keluhan,
                status: "baru", sumber: "website", dibuat: fb.serverTimestamp()
              });
            })(), 7000);
            tersimpan = true;
          } catch (err) {
            console.warn("Data belum tersimpan ke Firebase:", err);
          }

          // 2) Siapkan pesan WhatsApp
          const pesan =
            "Halo Admin, saya ingin buat janji temu.\n\n" +
            `Nama: ${nama}\nNo. WA: ${hp}\nLayanan: ${layanan}\nDokter: ${dokLabel}\n` +
            `Tanggal: ${tglLabel}\nJam: ${jam}` + (keluhan ? `\nKeluhan: ${keluhan}` : "");
          document.getElementById("btnWa").href = `https://wa.me/${WA}?text=${encodeURIComponent(pesan)}`;

          // 3) Tampilkan ringkasan
          sukses.querySelector("h3").textContent = tersimpan
            ? "Janji temu Anda sudah dicatat"
            : "Satu langkah lagi untuk menyelesaikan janji";
          sukses.querySelector("p").textContent = tersimpan
            ? "Satu langkah lagi: kirim konfirmasi ke admin lewat WhatsApp."
            : "Kirim detail janji Anda ke admin lewat WhatsApp agar jadwalnya bisa dikonfirmasi.";

          const ring = document.getElementById("ringkasan");
          ring.innerHTML = "";
          [["Nama", nama], ["Layanan", layanan], ["Dokter", dokLabel], ["Jadwal", `${tglLabel}, ${jam}`]].forEach(([k, v]) => {
            const li = document.createElement("li");
            li.className = "flex justify-between gap-4";
            const a = document.createElement("span"); a.className = "text-slate-500"; a.textContent = k;
            const b = document.createElement("span"); b.className = "font-semibold text-slate-800 text-right"; b.textContent = v;
            li.append(a, b); ring.append(li);
          });

          f.classList.add("hidden");
          sukses.classList.remove("hidden");
        } catch (err) {
          console.error(err);
          tampilError("Maaf, terjadi kendala. Silakan coba lagi atau hubungi admin lewat WhatsApp.");
        } finally {
          btnKirim.disabled = false;
          btnKirim.textContent = "Kirim Janji Temu";
        }
      });

      document.getElementById("btnUlang").addEventListener("click", () => {
        f.reset();
        refreshSlots();
        sukses.classList.add("hidden");
        f.classList.remove("hidden");
      });
    })();
  </script>
</body>
</html>
